name: Deploy prototype to GitHub Pages

on:
  # Déploiement manuel : activer d'abord Pages dans Settings > Pages > Source:
  # GitHub Actions, puis lancer ce workflow depuis l'onglet Actions.
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish static prototype
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: modern-proto

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
