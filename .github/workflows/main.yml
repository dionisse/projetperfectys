name: Validate static prototype

on:
  push:
    branches:
      - 'arena/658dcef5-projetperfectys'
      - main
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    name: Static checks & business rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          missing=0
          for file in index.html modern-proto/index.html modern-proto/css/modern.css modern-proto/css/accounting-configuration.css modern-proto/css/table-design-system.css modern-proto/js/app.js modern-proto/js/store.js modern-proto/js/modules.js modern-proto/js/permissions.js modern-proto/js/accounting-navigation.js modern-proto/js/accounting-exchange.js modern-proto/js/journal-lines-report.js modern-proto/js/bank-statement.js modern-proto/js/bank-statement-storage.js modern-proto/js/accounting-consolidation.js modern-proto/js/accounting-balance-recalculation.js modern-proto/js/accounting-database-repair.js modern-proto/js/accounting-chart.js modern-proto/js/accounting-framework.js modern-proto/js/centralization-cancellation.js modern-proto/js/fixed-asset-overview-report.js modern-proto/css/fixed-asset-overview-report.css modern-proto/vendor/fflate-0.8.2.js modern-proto/vendor/FFLATE-LICENSE.txt modern-proto/manifest.webmanifest modern-proto/service-worker.js modern-proto/icon-192.png modern-proto/icon-512.png; do
            if [ ! -f "$file" ]; then
              echo "::error::Fichier obligatoire manquant : $file"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "Tous les fichiers du prototype sont présents."

      - name: Validate manifest JSON
        run: |
          python3 - <<'PY'
          import json
          with open('modern-proto/manifest.webmanifest', encoding='utf-8') as handle:
              data = json.load(handle)
          assert data.get('name') and data.get('icons'), 'Manifest incomplet'
          print('manifest.webmanifest valide :', data['short_name'])
          PY

      - name: Check JavaScript syntax
        run: |
          for file in modern-proto/js/*.js modern-proto/vendor/*.js modern-proto/service-worker.js; do
            node --check "$file"
            echo "Syntaxe OK : $file"
          done

      - name: Run accounting framework, reconciliation, balance recalculation, database repair, folder, module, access policy, navigation and cancellation tests
        run: |
          node tests/store.test.js
          node tests/workspaces.test.js
          node tests/modules.test.js
          node tests/permissions.test.js
          node tests/accounting-navigation.test.js
          node tests/table-design-system.test.js
          node tests/journal-lines-report.test.js
          node tests/account-movements.test.js
          node tests/analytical-centers.test.js
          node tests/reconciliation-workflows.test.js
          node tests/bank-statement.test.js
          node tests/accounting-chart.test.js
          node tests/accounting-framework.test.js
          node tests/account-lifecycle.test.js
          node tests/payroll-centralization.test.js
          node tests/payroll-hr.test.js
          node tests/sales-centralization.test.js
          node tests/sales-stock-invoicing.test.js
          node tests/accounting-exchange.test.js
          node tests/accounting-consolidation.test.js
          node tests/accounting-balance-recalculation.test.js
          node tests/accounting-database-repair.test.js
          node tests/confidential-accounts.test.js
          node tests/centralization-cancellation.test.js

      - name: Run fixed-asset overview report tests
        run: |
          node tests/fixed-asset-overview-report.test.js
          node tests/fixed-asset-overview-report-ui.test.js

      - name: Smoke test static server
        run: |
          python3 -m http.server 8080 >/tmp/perfecto-http.log 2>&1 &
          sleep 1
          for path in / /modern-proto/ /modern-proto/index.html /modern-proto/css/modern.css /modern-proto/css/accounting-configuration.css /modern-proto/css/table-design-system.css /modern-proto/js/app.js /modern-proto/js/store.js /modern-proto/js/modules.js /modern-proto/js/permissions.js /modern-proto/js/accounting-navigation.js /modern-proto/js/accounting-exchange.js /modern-proto/js/journal-lines-report.js /modern-proto/js/bank-statement.js /modern-proto/js/bank-statement-storage.js /modern-proto/js/accounting-consolidation.js /modern-proto/js/accounting-balance-recalculation.js /modern-proto/js/accounting-database-repair.js /modern-proto/js/accounting-chart.js /modern-proto/js/accounting-framework.js /modern-proto/js/centralization-cancellation.js /modern-proto/js/fixed-asset-overview-report.js /modern-proto/css/fixed-asset-overview-report.css /modern-proto/vendor/fflate-0.8.2.js /modern-proto/manifest.webmanifest /modern-proto/service-worker.js /modern-proto/icon-192.png; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8080$path")
            if [ "$code" != "200" ]; then
              echo "::error::$path a renvoyé HTTP $code"
              exit 1
            fi
            echo "HTTP 200 : $path"
          done

      - name: Summary
        run: |
          {
            echo "### Prototype statique validé"
            echo ""
            echo "- Aucun Blazor, WebAssembly ou build requis."
            echo "- Application servie depuis modern-proto/, compatible avec un Root Directory Vercel au choix (. ou modern-proto)."
            echo "- Tests des règles métier exécutés avec succès."
          } >> "$GITHUB_STEP_SUMMARY"
