name: Build and publish Blazor site

on:
  push:
    branches:
      - 'arena/658dcef5-projetperfectys'
  workflow_dispatch: {}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Exit if skip-ci commit
        if: "contains(github.event.head_commit.message, '[skip ci]')"
        run: |
          echo "Skipping workflow for [skip ci] commit"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Unzip source archive
        run: |
          mkdir -p src
          unzip -q Perfecto-Next-0.2.0-preview.1-source.zip -d src

      - name: Find first .csproj
        id: find-proj
        run: |
          proj=$(find src -name '*.csproj' | head -n1 || true)
          if [ -z "$proj" ]; then echo "No .csproj found in source archive" >&2; exit 1; fi
          echo "proj=$proj" >> $GITHUB_OUTPUT

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: dotnet publish
        run: |
          dotnet publish "${{ steps.find-proj.outputs.proj }}" -c Release -o publish_output

      - name: Copy publish output to modern-proto/dist
        run: |
          mkdir -p modern-proto/dist
          if [ -d publish_output/wwwroot ]; then
            cp -a publish_output/wwwroot/. modern-proto/dist/
          else
            cp -a publish_output/. modern-proto/dist/ || true
          fi

      - name: Commit built files back to branch (skip CI)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modern-proto/dist || true
          git commit -m "ci(build): add publish output [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}
