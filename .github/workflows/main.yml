name: Validate static prototype

on:
  push:
    branches:
      - 'arena/658dcef5-projetperfectys'
      - main
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    name: Static checks & business rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          missing=0
          for file in index.html modern-proto/index.html modern-proto/css/modern.css modern-proto/css/accounting-configuration.css modern-proto/css/table-design-system.css modern-proto/js/app.js modern-proto/js/store.js modern-proto/js/modules.js modern-proto/js/permissions.js modern-proto/js/accounting-navigation.js modern-proto/js/accounting-exchange.js modern-proto/js/journal-lines-report.js modern-proto/js/bank-statement.js modern-proto/js/bank-statement-storage.js modern-proto/js/accounting-consolidation.js modern-proto/js/accounting-balance-recalculation.js modern-proto/js/accounting-database-repair.js modern-proto/js/accounting-chart.js modern-proto/js/accounting-framework.js modern-proto/js/centralization-cancellation.js modern-proto/js/fixed-asset-overview-report.js modern-proto/css/fixed-asset-overview-report.css modern-proto/js/fixed-asset-depreciation-report.js modern-proto/css/fixed-asset-depreciation-report.css modern-proto/css/fixed-asset-additional-reports.css modern-proto/css/financial-framework-edition.css modern-proto/css/balance-items-edition.css modern-proto/css/accounting-plan-edition.css modern-proto/css/definitions-plans-edition.css modern-proto/css/associated-items-edition.css modern-proto/css/vat-difference-report.css modern-proto/css/vat-payment-report.css modern-proto/css/vat-detail-report.css modern-proto/assets/vat-declaration-template.xlsx modern-proto/css/aib-suppliers-report.css modern-proto/css/nominative-declaration-report.css modern-proto/css/bic-advances-report.css modern-proto/css/ohada-financial-statements.css modern-proto/js/vat-difference-report.js modern-proto/js/vat-payment-report.js modern-proto/js/vat-declaration-workbook.js modern-proto/js/vat-payment-allocation.js modern-proto/js/vat-detail-report.js modern-proto/js/aib-suppliers-report.js modern-proto/js/nominative-declaration-report.js modern-proto/js/bic-advances-report.js modern-proto/js/ohada-financial-statements.js modern-proto/js/accounting-plan-edition-report.js modern-proto/js/accounting-associated-items.js modern-proto/js/account-associated-items-edition-report.js modern-proto/js/definitions-plans-edition-reports.js modern-proto/js/fixed-asset-additional-reports.js modern-proto/js/accounting-framework-edition-report.js modern-proto/js/accounting-balance-items.js modern-proto/js/balance-items-edition-report.js modern-proto/vendor/fflate-0.8.2.js modern-proto/vendor/FFLATE-LICENSE.txt modern-proto/assets/OHADAr-template.xlsx modern-proto/assets/aib-suppliers-template.xlsx modern-proto/manifest.webmanifest modern-proto/service-worker.js modern-proto/icon-192.png modern-proto/icon-512.png; do
            if [ ! -f "$file" ]; then
              echo "::error::Fichier obligatoire manquant : $file"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "Tous les fichiers du prototype sont présents."

      - name: Validate manifest JSON
        run: |
          python3 - <<'PY'
          import json
          with open('modern-proto/manifest.webmanifest', encoding='utf-8') as handle:
              data = json.load(handle)
          assert data.get('name') and data.get('icons'), 'Manifest incomplet'
          print('manifest.webmanifest valide :', data['short_name'])
          PY

      - name: Check JavaScript syntax
        run: |
          for file in modern-proto/js/*.js modern-proto/vendor/*.js modern-proto/service-worker.js; do
            node --check "$file"
            echo "Syntaxe OK : $file"
          done

      - name: Run complete test suite
        run: npm test

      - name: Smoke test static server
        run: |
          python3 -m http.server 8080 >/tmp/perfecto-http.log 2>&1 &
          sleep 1
          for path in / /modern-proto/ /modern-proto/index.html /modern-proto/css/modern.css /modern-proto/css/accounting-configuration.css /modern-proto/css/table-design-system.css /modern-proto/js/app.js /modern-proto/js/store.js /modern-proto/js/modules.js /modern-proto/js/permissions.js /modern-proto/js/accounting-navigation.js /modern-proto/js/accounting-exchange.js /modern-proto/js/journal-lines-report.js /modern-proto/js/bank-statement.js /modern-proto/js/bank-statement-storage.js /modern-proto/js/accounting-consolidation.js /modern-proto/js/accounting-balance-recalculation.js /modern-proto/js/accounting-database-repair.js /modern-proto/js/accounting-chart.js /modern-proto/js/accounting-framework.js /modern-proto/js/centralization-cancellation.js /modern-proto/js/fixed-asset-overview-report.js /modern-proto/css/fixed-asset-overview-report.css /modern-proto/js/fixed-asset-depreciation-report.js /modern-proto/css/fixed-asset-depreciation-report.css /modern-proto/css/fixed-asset-additional-reports.css /modern-proto/css/financial-framework-edition.css /modern-proto/css/balance-items-edition.css /modern-proto/js/fixed-asset-additional-reports.js /modern-proto/js/accounting-framework-edition-report.js /modern-proto/js/accounting-balance-items.js /modern-proto/js/balance-items-edition-report.js /modern-proto/js/accounting-plan-edition-report.js /modern-proto/css/accounting-plan-edition.css /modern-proto/css/definitions-plans-edition.css /modern-proto/css/associated-items-edition.css /modern-proto/css/vat-difference-report.css /modern-proto/css/vat-payment-report.css /modern-proto/css/vat-detail-report.css /modern-proto/css/aib-suppliers-report.css /modern-proto/css/nominative-declaration-report.css /modern-proto/css/bic-advances-report.css /modern-proto/css/ohada-financial-statements.css /modern-proto/js/vat-difference-report.js /modern-proto/js/vat-payment-report.js /modern-proto/js/vat-payment-allocation.js /modern-proto/js/vat-declaration-workbook.js /modern-proto/js/vat-detail-report.js /modern-proto/js/aib-suppliers-report.js /modern-proto/js/nominative-declaration-report.js /modern-proto/js/bic-advances-report.js /modern-proto/js/ohada-financial-statements.js /modern-proto/js/definitions-plans-edition-reports.js /modern-proto/js/accounting-associated-items.js /modern-proto/js/account-associated-items-edition-report.js /modern-proto/vendor/fflate-0.8.2.js /modern-proto/assets/OHADAr-template.xlsx /modern-proto/assets/aib-suppliers-template.xlsx /modern-proto/assets/vat-declaration-template.xlsx /modern-proto/manifest.webmanifest /modern-proto/service-worker.js /modern-proto/icon-192.png; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8080$path")
            if [ "$code" != "200" ]; then
              echo "::error::$path a renvoyé HTTP $code"
              exit 1
            fi
            echo "HTTP 200 : $path"
          done

      - name: Summary
        run: |
          {
            echo "### Prototype statique validé"
            echo ""
            echo "- Aucun Blazor, WebAssembly ou build requis."
            echo "- Application servie depuis modern-proto/, compatible avec un Root Directory Vercel au choix (. ou modern-proto)."
            echo "- Tests des règles métier exécutés avec succès."
          } >> "$GITHUB_STEP_SUMMARY"
