<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12213a" />
    <meta name="description" content="Suite de gestion modulaire SYSCOHADA, disponible sur Windows et en PWA hors ligne." />
    <title>PERFECTO Nouvelle Génération</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="_content/Perfecto.Shared.UI/css/perfecto.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>
<body>
    <div id="app">
        <div class="boot-screen">
            <img src="icon-192.png" alt="" />
            <strong>PERFECTO</strong>
            <span>Chargement du socle de gestion…</span>
        </div>
    </div>

    <div id="blazor-error-ui">
        Une erreur inattendue est survenue.
        <a href="." class="reload">Recharger</a>
        <button class="dismiss" type="button">Fermer</button>
    </div>
    <script>
        window.perfectoConnectivity = {
            isOnline: () => navigator.onLine
        };
    </script>
    <script src="js/perfecto-db.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>
</html>
